name: apply-verified-scenario-remediation

on:
  push:
    branches: [fix/scenario-router-r01-r05]
    paths: [.github/workflows/apply-scenario-remediation.yml]

permissions:
  contents: write

concurrency:
  group: apply-scenario-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/scenario-router-r01-r05' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact offline-tested patch and apply only allowed code paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/remediation-validation
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          paths = [pathlib.Path(f'.maintenance/scenario-remediation-{i:02}.b64') for i in range(1, 5)]
          data = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths), validate=True))
          expected = '6e7769e2a0ea5fb3c95c269e3bc42fe9926a76284c6a0a5bad65c1d4237f4bbc'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch; no code changed')
          patch = pathlib.Path('/tmp/remediation-validation/remediation.patch')
          patch.write_bytes(data)
          allowed = {
              'scalp_bot/paper.py', 'scalp_bot/risk.py', 'scalp_bot/scenario.py',
              'scalp_bot/scenario_episodes.py', 'scalp_bot/scenario_identity.py',
              'scalp_bot/strategy/breakout.py', 'scalp_bot/strategy/preparation.py',
              'scalp_bot/strategy/price_action_hypothesis.py', 'scalp_bot/strategy/trend_structure.py',
              'scalp_bot/strategy/weak_level_rejection.py', 'scalp_bot/strategy_policy.py',
              'tests/test_offline_portfolio.py', 'tests/test_scenario_remediation.py',
              'tests/test_scenario_router.py', 'tests/test_trade_flow_equivalence.py',
          }
          paths_in_patch = {line.split(' b/', 1)[1] for line in data.decode().splitlines() if line.startswith('diff --git ')}
          if paths_in_patch != allowed:
              raise SystemExit(f'Unexpected patch paths: {paths_in_patch ^ allowed}')
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected staged paths: {changed ^ allowed}')
          pathlib.Path('/tmp/remediation-validation/patch-sha256.txt').write_text(expected + '\n')
          PY
      - name: Install declared test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate complete suite and historical snapshot contracts without market run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_preflight.py 2>&1 | tee /tmp/remediation-validation/pytest.txt
          python scripts/check-scenario-episodes.py --output /tmp/remediation-validation/episodes.json
          python -m compileall -q scalp_bot tests/test_scenario_remediation.py
          node --check scalp_bot/static/app.js
          node --check scalp_bot/static/replay.js
          git diff --cached --check
      - name: Publish validated code to the correction branch only
        shell: bash
        run: |
          set -euo pipefail
          git rm .maintenance/scenario-remediation-0{1,2,3,4}.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix scenario runner pricing, object binding and causal episode lifecycle (R01-R05)'
          git push origin HEAD:refs/heads/fix/scenario-router-r01-r05
          git rev-parse HEAD > /tmp/remediation-validation/published-commit.txt
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-remediation-validation-${{ github.run_id }}
          path: /tmp/remediation-validation/
          retention-days: 14
