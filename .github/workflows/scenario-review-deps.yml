name: scenario-review-deps
on:
  push:
    branches: [fix/scenario-contracts-r01-r05]
    paths: [.github/workflows/scenario-review-deps.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: --no-deps 'msgspec>=0.19,<1' 'zstandard>=0.23,<1' --dest /tmp/scenario-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-review-wheels
          path: /tmp/scenario-wheels/
          retention-days: 1
          if-no-files-found: error
