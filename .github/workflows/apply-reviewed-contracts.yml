name: apply-reviewed-contracts

on:
  push:
    branches: [fix/scenario-contracts-r01-r05]
    paths: [.github/workflows/apply-reviewed-contracts.yml]

permissions:
  contents: write

jobs:
  apply-tested-patch:
    if: github.repository == 'branch-danya-dev/scalp-bot' && github.ref == 'refs/heads/fix/scenario-contracts-r01-r05'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode exact reviewed patch and apply
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          payload = ''.join(pathlib.Path(f'.review/r01-r05.{i}').read_text().strip() for i in range(4))
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          expected = 'c4fced8d35ffe4caef75809829e198118bb00edc8acbd47c98d46158f9aa0750'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch checksum mismatch: {actual}')
          path = pathlib.Path('/tmp/reviewed-contracts.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          print('Applied exact SHA256', actual)
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete offline test suite
        run: |
          set -o pipefail
          python scripts/test_preflight.py 2>&1 | tee /tmp/reviewed-contracts-tests.txt
          python scripts/check-scenario-episodes.py --output /tmp/reviewed-contracts-episodes.json
          python -m compileall -q scalp_bot tests/test_review_contracts.py
          node --check scalp_bot/static/app.js
          node --check scalp_bot/static/replay.js
          git diff --check
      - name: Commit verified source only to isolated correction branch
        run: |
          python - <<'PY'
          import subprocess
          files = [
              'HANDOFF.md', 'docs/scenario-contracts-r01-r05.md',
              'scalp_bot/risk.py', 'scalp_bot/scenario.py',
              'scalp_bot/scenario_episodes.py', 'scalp_bot/scenario_runtime.py',
              'scalp_bot/strategy/breakout.py', 'scalp_bot/strategy/preparation.py',
              'scalp_bot/strategy/price_action_hypothesis.py',
              'scalp_bot/strategy/scenario_objects.py',
              'scalp_bot/strategy/trend_structure.py',
              'scalp_bot/strategy/weak_level_rejection.py',
              'tests/test_e01_comparison.py', 'tests/test_offline_portfolio.py',
              'tests/test_review_contracts.py', 'tests/test_scenario_router.py',
              'tests/test_trade_flow_equivalence.py',
          ]
          subprocess.run(['git', 'add', '--', *files], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if set(changed) != set(files):
              raise SystemExit(f'Unexpected staged files: {changed}')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: enforce scenario object, episode and payoff contracts (R01-R05)'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/scenario-contracts-r01-r05'], check=True)
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-contracts-validation-${{ github.sha }}
          path: |
            /tmp/reviewed-contracts-tests.txt
            /tmp/reviewed-contracts-episodes.json
          retention-days: 7
          if-no-files-found: warn
