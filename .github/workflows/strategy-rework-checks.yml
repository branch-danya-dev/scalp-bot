name: strategy-rework-checks

on:
  push:
    branches:
      - main
      - feat/trade-observatory
      - feat/research-economics-refactor
      - feat/level-zones-breakout
      - paper-run-v2-10h
      - paper-run-v3-4h
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Python tests
        run: python scripts/test_preflight.py
      - name: JavaScript syntax
        run: |
          node --check scalp_bot/static/app.js
          node --check scalp_bot/static/replay.js

  ml-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional CPU learning environment
        run: python -m pip install -e ".[dev,ml]"
      - name: Spawn, causal data and saved model regressions
        run: python -m pytest -q tests/ml tests/demo_paper tests/test_parallel_scenarios.py tests/test_transport_recovery.py tests/test_journal_writer_pipeline.py tests/test_capture_hotpath_equivalence.py tests/test_capture_benchmark_clocks.py tests/test_wave2_smoke_gate.py tests/test_paper_capture.py tests/test_tape_window_work.py tests/test_forming_candle_context.py tests/test_trade_flow_equivalence.py tests/test_paired_paper.py tests/test_experiment_controller.py tests/test_experiment_finalization_receipt.py tests/test_pipeline_evidence.py
