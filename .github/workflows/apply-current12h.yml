name: validate-assigned-continuation-current12h

on:
  push:
    branches: [fix/assigned-continuation-current-12h]
    paths: [.github/workflows/apply-current12h.yml]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline-tested patch and exact allowed source paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current12h-validation
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          paths = [pathlib.Path(f'.maintenance/current12h-{i:02}.b64') for i in range(1, 5)]
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths), validate=True))
          expected = 'e608cc38f5ab7c8ad6a5fcdab2df656a9a34b4f65f1619073ac7b1a06bec72ad'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch; source not changed')
          allowed = {'.env.paper-capture-current-12h', 'HANDOFF.md', 'README.md',
              'docs/current-12h-readiness.md', 'scalp_bot/capture.py', 'scalp_bot/scenario.py',
              'scripts/check-paper-capture.ps1', 'scripts/paper-capture-preflight.py',
              'scripts/run-paper-capture-current-12h.ps1', 'scripts/run-paper-capture.ps1',
              'tests/test_current_12h_profile.py', 'tests/test_offline_portfolio.py',
              'tests/test_scenario_continuation.py'}
          actual = {line.split(' b/', 1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          if actual != allowed:
              raise SystemExit(f'Unexpected patch paths: {actual ^ allowed}')
          p = pathlib.Path('/tmp/current12h-validation/lifecycle-current-12h.patch')
          p.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(p)], check=True)
          subprocess.run(['git', 'apply', '--index', str(p)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if staged != allowed:
              raise SystemExit(f'Unexpected staged paths: {staged ^ allowed}')
          pathlib.Path('/tmp/current12h-validation/patch-sha256.txt').write_text(expected + '\n')
          PY
      - name: Install declared dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate offline suite, virtual 43200-second capture and historical contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_preflight.py 2>&1 | tee /tmp/current12h-validation/pytest.txt
          python -m pytest tests/test_scenario_continuation.py tests/test_current_12h_profile.py -q 2>&1 | tee /tmp/current12h-validation/targeted.txt
          python scripts/check-scenario-episodes.py --output /tmp/current12h-validation/episodes.json
          python -m compileall -q scalp_bot scripts
          node --check scalp_bot/static/app.js
          node --check scalp_bot/static/replay.js
          git diff --cached --check
      - name: Parse PowerShell launchers without starting the application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @('scripts/run-paper-capture-current-12h.ps1', 'scripts/run-paper-capture.ps1', 'scripts/check-paper-capture.ps1')
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
            Write-Output "PowerShell syntax passed: $path"
          }
          Write-Output 'No launcher, Bybit feed or market run was started.'
      - name: Publish verified source to correction branch only
        shell: bash
        run: |
          set -euo pipefail
          git rm .maintenance/current12h-0{1,2,3,4}.b64 .github/workflows/apply-current12h.yml
          test "$(git write-tree)" = 'a5781b1659f962b2c0724633c3b93de37f5d0cf9'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Release unprepared ineligible scenario owners and prepare fixed current-12h paper capture'
          git push origin HEAD:refs/heads/fix/assigned-continuation-current-12h
          git rev-parse HEAD > /tmp/current12h-validation/published-commit.txt
          git rev-parse HEAD^{tree} > /tmp/current12h-validation/source-tree.txt
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current12h-validation-${{ github.run_id }}
          path: /tmp/current12h-validation/
          retention-days: 14
