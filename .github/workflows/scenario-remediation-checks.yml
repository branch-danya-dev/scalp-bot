name: scenario-remediation-checks

on:
  push:
    branches: [fix/scenario-router-r01-r05]
  pull_request:
    branches: [main]
    paths:
      - 'scalp_bot/**'
      - 'tests/**'
      - '.github/workflows/scenario-remediation-checks.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked source and declared dependencies for offline testing
        shell: bash
        run: |
          mkdir -p /tmp/scenario-input/wheels /tmp/scenario-validation
          git rev-parse HEAD > /tmp/scenario-input/commit.txt
          git archive --format=tar HEAD > /tmp/scenario-input/source.tar
          python - <<'PY'
          import pathlib, tomllib
          p = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          pathlib.Path('/tmp/scenario-input/requirements.txt').write_text('\n'.join(p['dependencies'] + p['optional-dependencies']['dev']) + '\n')
          PY
          python -m pip download --only-binary=:all: --dest /tmp/scenario-input/wheels -r /tmp/scenario-input/requirements.txt
      - name: Upload reproducible test inputs
        uses: actions/upload-artifact@v4
        with:
          name: scenario-input-${{ github.sha }}
          path: /tmp/scenario-input/
          retention-days: 7
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests
        shell: bash
        run: |
          set -o pipefail
          python scripts/test_preflight.py 2>&1 | tee /tmp/scenario-validation/pytest.txt
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-validation-${{ github.sha }}
          path: /tmp/scenario-validation/
          retention-days: 7
