name: scenario-contracts

on:
  push:
    branches: [fix/scenario-contracts-r01-r05]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scenario-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Complete offline tests and historical snapshot checks
        run: |
          set -o pipefail
          mkdir -p /tmp/scenario-validation
          git rev-parse HEAD > /tmp/scenario-validation/COMMIT.txt
          python scripts/test_preflight.py 2>&1 | tee /tmp/scenario-validation/tests.txt
          python scripts/check-scenario-episodes.py --output /tmp/scenario-validation/episodes.json
          python -m compileall -q scalp_bot tests/test_review_contracts.py
          git diff --check
      - name: JavaScript syntax
        run: |
          node --check scalp_bot/static/app.js
          node --check scalp_bot/static/replay.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-validation-${{ github.sha }}
          path: /tmp/scenario-validation/
          retention-days: 7
          if-no-files-found: warn
