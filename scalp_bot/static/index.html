<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scalp Bot</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<main class="shell">
  <header class="topbar card">
    <div class="brand">
      <div class="traffic"><i></i><i></i><i></i></div>
      <strong>Scalp Bot</strong><span class="badge">PAPER</span>
    </div>
    <div class="actions">
      <a class="button secondary link-button" href="/replay">Replay</a>
      <span id="connection" class="live">Подключение…</span>
      <button id="stopBtn" class="button secondary">Стоп</button>
      <button id="startBtn" class="button primary">Запустить</button>
    </div>
  </header>
  <section class="metrics">
    <div class="metric card"><span>Баланс</span><strong id="balance">—</strong></div>
    <div class="metric card"><span>PnL сессии</span><strong id="pnl">—</strong></div>
    <div class="metric card"><span>Открыто позиций</span><strong id="positionCount">0</strong></div>
    <div class="metric card"><span>Свободная экспозиция</span><strong id="availableExposure">—</strong></div>
    <div class="metric card"><span>Cost gate</span><strong id="costGate">—</strong></div>
  </section>
  <section class="workspace">
    <aside class="card side">
      <div class="heading"><h2>Активные монеты</h2><span id="workCount">0</span></div>
      <div id="workingList"></div>
      <div class="divider"></div>
      <div class="heading"><h2>Рейтинг активности</h2><span>5m / 24h</span></div>
      <div id="candidateList" class="candidates"></div>
    </aside>
    <section class="card chart-card">
      <div class="chart-head">
        <div><h1 id="symbolTitle">—</h1><span id="symbolMeta">Ожидание данных</span></div>
        <span id="trendBadge" class="trend flat">FLAT</span>
      </div>
      <div id="chart"></div>
      <div id="positionCard" class="position-card hidden"></div>
      <div id="decisionStrip" class="decision-strip"></div>
    </section>
    <aside class="card book">
      <div class="heading"><h2>Стакан</h2><span id="spread">—</span></div>
      <div class="book-head"><span>Цена</span><span>Кол-во</span><span>USD</span></div>
      <div id="asks"></div>
      <div id="midPrice" class="mid">—</div>
      <div id="bids"></div>
    </aside>
  </section>
  <section class="bottom">
    <article class="card panel">
      <div class="heading"><h2>Стратегии</h2><span>только по тренду</span></div>
      <div id="strategyList"></div>
    </article>
    <article class="card panel">
      <div class="heading"><h2>Лента решений</h2><span id="sessionFile">session</span></div>
      <div id="events" class="events"></div>
    </article>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
